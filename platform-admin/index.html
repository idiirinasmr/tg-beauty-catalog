<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Платформа — BeautyApp</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/admin/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/admin/style.css">
    <link rel="stylesheet" href="platform.css">
</head>
<body>
    <section id="view-login" class="auth" hidden>
        <div class="auth-card fade-up">
            <div class="brand"><span class="brand-mark">B</span> Платформа</div>
            <h1 class="auth-title">Панель<br><em>владельца</em></h1>
            <p class="auth-sub">Доступ только для ADMIN_TELEGRAM_IDS.</p>
            <div id="login-widget" class="login-widget"></div>
            <form id="dev-login" class="dev-login" hidden>
                <p class="auth-hint">Локальная разработка</p>
                <div class="row">
                    <input class="input" name="id" inputmode="numeric" placeholder="Telegram ID" required>
                    <button class="btn btn-primary" type="submit">Войти</button>
                </div>
            </form>
        </div>
    </section>

    <div id="view-app" hidden>
        <header class="topbar">
            <div class="brand"><span class="brand-mark">B</span> Платформа</div>
            <button class="btn btn-ghost btn-sm" id="logout">Выйти</button>
        </header>
        <main class="main wide" id="main"></main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="platform.js"></script>
</body>
</html>
